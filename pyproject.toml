[project]
name = "vault-mcp"
version = "0.1.0"
description = "MCP server that exposes an Obsidian markdown vault (wiki with YAML frontmatter + wikilinks) as tools for an LLM agent."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "python-frontmatter>=1.1.0",
    "chromadb>=0.5.0",
    "FlagEmbedding>=1.2.0",
    "torch>=2.0.0",
]

[project.scripts]
vault-mcp = "vault_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_mcp"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
